<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Vault</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">K</div>
      <div>
        <div class="brand-title">Knowledge Vault</div>
        <div class="brand-sub">My internal knowledge</div>
      </div>
    </div>

    <button class="new-btn" onclick="openEditor()">＋ 새 지식</button>

    <nav id="categoryList"></nav>

    <div class="sidebar-bottom">
      <button class="ghost-btn" onclick="backup()">↗ DB 백업</button>
      <div class="server-status"><span></span> Local server</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL KNOWLEDGE BASE</div>
        <h1>내가 아는 것을<br><em>빠르게 다시 찾는 곳.</em></h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" title="새 지식" onclick="openEditor()">＋</button>
      </div>
    </header>

    <section class="search-area">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" autocomplete="off"
               placeholder="지식 검색... 제목, 내용, 태그를 입력해보세요"
               oninput="onSearchInput(event)">
        <kbd>Ctrl K</kbd>
      </div>
      <div id="searchHint" class="search-hint">몇 글자만 입력해도 바로 찾아드립니다.</div>
    </section>

    <section class="content-head">
      <div>
        <span id="sectionLabel">최근 지식</span>
        <span id="countBadge" class="count-badge">0</span>
      </div>
      <button class="sort-btn" onclick="loadCurrent()">최근 수정순 ↕</button>
    </section>

    <section id="cards" class="cards"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="eyebrow" id="modalEyebrow">NEW KNOWLEDGE</div>
        <h2 id="modalTitle">새 지식</h2>
      </div>
      <button class="close-btn" onclick="closeEditor()">×</button>
    </div>

    <form id="knowledgeForm" onsubmit="saveKnowledge(event)">
      <input type="hidden" id="knowledgeId">

      <label>제목</label>
      <input id="title" class="form-input" required placeholder="예: SQLAlchemy Connection Pool 관리">

      <div class="form-row">
        <div>
          <label>카테고리</label>
          <select id="category" class="form-input"></select>
        </div>
        <div>
          <label>태그 <span class="muted">(쉼표로 구분)</span></label>
          <input id="tags" class="form-input" placeholder="FastAPI, DB, SQLAlchemy">
        </div>
      </div>

      <label>내용</label>
      <textarea id="content" class="content-input"
        placeholder="여기에 업무하면서 알게 된 내용을 자유롭게 기록하세요.

예:
# 문제
DB connection이 900초 이후 끊김

# 원인
...

# 해결
..."></textarea>

      <label>첨부파일 <span class="muted">(여러 파일 선택 가능)</span></label>
      <div class="attachment-drop">
        <input type="file" id="attachmentInput" multiple>
        <small>이미지, PDF, Office, 로그, 코드 등 원하는 파일을 첨부할 수 있습니다.</small>
      </div>
      <div id="existingAttachments" class="existing-attachments"></div>

      <div class="modal-footer">
        <button type="button" id="deleteBtn" class="danger-btn hidden" onclick="deleteKnowledge()">삭제</button>
        <div class="footer-right">
          <button type="button" class="cancel-btn" onclick="closeEditor()">취소</button>
          <button type="submit" class="save-btn">저장하기</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/static/app.js?v=20260916-category-cli-fix3"></script>
</body>
</html>
